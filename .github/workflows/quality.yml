name: Quality

# Reusable quality gate (tsc + unit tests). Called by both ci.yml (PRs/pushes) and
# release.yml (so the published artifact is gated, not just merges). Keeping it in one
# place means CI and Release can never drift out of sync.
on:
  workflow_call:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # verify:local includes typecheck, lint, dependency audit, env-example
      # audit, import-boundary audit, bridge-origin audit, docs drift, unit
      # tests, coverage, and verify:whitespace. Lint is scoped to the
      # diveo/GSAV surface + utils + scripts; the frozen Bilibili legacy is
      # intentionally not linted (slated for deletion, ADR 0001).
      - name: Local verification bundle
        run: npm run verify:local

      - name: Native production config placeholder audit
        env:
          EXPO_PUBLIC_GSAV_WEB_URL: https://gsav.example.com
          EXPO_PUBLIC_GSAV_CATALOG_URL: https://gsav.example.com/functions/v1/catalog
          EXPO_PUBLIC_GSAV_SUPABASE_URL: https://supabase.example.com
          EXPO_PUBLIC_GSAV_SUPABASE_ANON_KEY: public-anon-key
        run: npm run verify:native-production-config
